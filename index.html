    <style>
        body { font-family: 'Nunito', sans-serif; touch-action: manipulation; overscroll-behavior: contain; background-color: #f0fdf4; transition: background-color 0.5s ease; }
        .main-container { background-color: white; border-radius: 1.5rem; box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.05), 0 4px 6px -4px rgb(0 0 0 / 0.1); border: 1px solid #e5e7eb; }
        .grid-container { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); grid-template-rows: repeat(5, minmax(0, 1fr)); gap: 0.5rem; width: 100%; max-width: 400px; aspect-ratio: 1 / 1; }
        .cell { display: flex; justify-content: center; align-items: center; border-radius: 0.75rem; font-size: clamp(1.1rem, 4.5vw, 1.4rem); font-weight: 800; color: #374151; }
        .input { background-color: #fefce8; border: 2px dashed #fde68a; cursor: pointer; transition: all 0.2s ease-in-out; }
        .input:hover, .input.over { background-color: #fef08a; border-color: #facc15; transform: scale(1.05); }
        .given, .operator, .equals { color: #4b5563; }
        .hint { background-color: #f3f4f6; border: 2px solid #d1d5db; color: #374151; font-weight: 700; }
        .number-tile { display: flex; justify-content: center; align-items: center; width: clamp(45px, 12vw, 55px); height: clamp(45px, 12vw, 55px); background-color: #ffffff; border-radius: 1rem; font-weight: 800; cursor: grab; transition: all 0.15s ease-out; user-select: none; font-size: clamp(1.1rem, 4.5vw, 1.4rem); }
        .number-tile:active { cursor: grabbing; transform: scale(1.1); border-bottom-width: 2px; margin-top: 2px; }
        .number-tile.dragging { opacity: 0.8; z-index: 1000; position: fixed; pointer-events: none; transform: scale(1.1); }
        .number-tile.used { opacity: 0.3; cursor: not-allowed; background-color: #f9fafb; }
        .correct { border-color: #4ade80 !important; background-color: #dcfce7 !important; animation: bounce 0.5s ease; }
        .incorrect { border-color: #f87171 !important; background-color: #fee2e2 !important; animation: shake 0.5s ease; }
        .action-button { padding: 0.75rem 1rem; border-radius: 1rem; font-weight: 700; font-size: 1.125rem; color: white; transition: all 0.2s ease-in-out; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1); border-bottom-width: 4px; }
        .action-button:active { transform: translateY(2px); border-bottom-width: 2px; }
        
        /* Green Theme (Default) */
        .theme-green .number-tile { border: 2px solid #86efac; border-bottom: 4px solid #22c55e; color: #166534; }
        .theme-green .number-tile.used { border-color: #d1d5db; }
        .theme-green .check-btn, .theme-green #play-again-btn { background-color: #22c55e; border-color: #15803d; }
        .theme-green .check-btn:hover, .theme-green #play-again-btn:hover { background-color: #16a34a; }
        .theme-green #numbers-container { background-color: #f0fdf4; }
        .theme-green #win-container h2 { color: #166534; }

        /* Red Theme (Expert Levels) */
        body.theme-red { background-color: #fef2f2; }
        .theme-red .number-tile { border: 2px solid #fca5a5; border-bottom: 4px solid #ef4444; color: #991b1b; }
        .theme-red .number-tile.used { border-color: #d1d5db; }
        .theme-red .check-btn, .theme-red #play-again-btn { background-color: #ef4444; border-color: #b91c1c; }
        .theme-red .check-btn:hover, .theme-red #play-again-btn:hover { background-color: #dc2626; }
        .theme-red #numbers-container { background-color: #fef2f2; }
        .theme-red #win-container h2 { color: #991b1b; }

        .reset-btn { background-color: #f97316; border-color: #c2410c; }
        .reset-btn:hover { background-color: #ea580c; }
        .next-level-btn { background-color: #3b82f6; border-color: #1d4ed8; }
        .next-level-btn:hover { background-color: #2563eb; }
        .confetti-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 100; }
        .confetti { position: absolute; width: 10px; height: 10px; background-color: #f00; border-radius: 50%; animation: fall 5s linear forwards; }
        @keyframes fall { to { transform: translateY(100vh) rotate(720deg); opacity: 0; } }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); } 20%, 40%, 60%, 80% { transform: translateX(5px); } }
        @keyframes bounce { 0%, 20%, 50%, 80%, 100% { transform: translateY(0); } 40% { transform: translateY(-10px); } 60% { transform: translateY(-5px); } }

<body class="flex flex-col items-center justify-center min-h-screen p-2 smp-4 theme-green">

    <div id="confetti-container" class="confetti-container"></div>

    <div class="main-container w-full max-w-md p-4 sm:p-6">
        <div class="text-center mb-4">
            <h1 class="text-3xl sm:text-4xl font-extrabold text-gray-800">Математичний Кросворд</h1>
            <p id="level-indicator" class="text-gray-500 font-semibold">Рівень 1</p>
        </div>

        <div class="flex justify-center mb-4">
            <div id="grid-container" class="grid-container"></div>
        </div>

        <p id="message-area" class="text-center h-6 mb-4 font-bold text-lg"></p>

        <div id="numbers-container" class="flex flex-wrap justify-center gap-2 mb-6 p-3 rounded-xl"></div>

        <div id="controls-container" class="flex flex-col sm:flex-row gap-4">
            <button id="check-btn" class="action-button check-btn w-full">Перевірити</button>
            <button id="reset-btn" class="action-button reset-btn w-full">Скинути</button>
        </div>
        
        <div id="next-level-container" class="hidden flex-col gap-4 mt-4">
             <button id="next-level-btn" class="action-button next-level-btn w-full">Наступний Рівень</button>
        </div>
        
         <div id="win-container" class="hidden text-center mt-4">
             <h2 class="text-2xl font-bold mb-4">Вітаємо! Ви пройшли всі рівні!</h2>
             <button id="play-again-btn" class="action-button w-full">Грати знову</button>
        </div>

    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const levelIndicator = document.getElementById('level-indicator');
            const gridContainer = document.getElementById('grid-container');
            const numbersContainer = document.getElementById('numbers-container');
            const messageArea = document.getElementById('message-area');
            const confettiContainer = document.getElementById('confetti-container');
            const controlsContainer = document.getElementById('controls-container');
            const nextLevelContainer = document.getElementById('next-level-container');
            const winContainer = document.getElementById('win-container');
            const checkBtn = document.getElementById('check-btn');
            const resetBtn = document.getElementById('reset-btn');
            const nextLevelBtn = document.getElementById('next-level-btn');
            const playAgainBtn = document.getElementById('play-again-btn');

            const levels = [
                // Levels 1-4 (Unchanged)
                {
                    numbers: [2, 3, 5, 7],
                    solution: { 'c00': 7, 'c02': 3, 'c20': 5, 'c22': 2 },
                    grid: [
                        { id: 'c00', type: 'input' }, { type: 'operator', value: '+' }, { id: 'c02', type: 'input' }, { type: 'equals', value: '=' }, { type: 'given', value: '10' },
                        { type: 'operator', value: '+' }, null, { type: 'operator', value: '*' }, null, null,
                        { id: 'c20', type: 'input' }, { type: 'operator', value: '*' }, { id: 'c22', type: 'input' }, { type: 'equals', value: '=' }, { type: 'given', value: '10' },
                        { type: 'equals', value: '=' }, null, { type: 'equals', value: '=' }, null, null,
                        { type: 'given', value: '12' }, null, { type: 'given', value: '6' }, null, null,
                    ]
                },
                {
                    numbers: [3, 5, 8, 12],
                    solution: { 'c00': 12, 'c02': 5, 'c20': 8, 'c22': 3 },
                    grid: [
                        { id: 'c00', type: 'input' }, { type: 'operator', value: '-' }, { id: 'c02', type: 'input' }, { type: 'equals', value: '=' }, { type: 'given', value: '7' },
                        { type: 'operator', value: '-' }, null, { type: 'operator', value: '+' }, null, null,
                        { id: 'c20', type: 'input' }, { type: 'operator', value: '+' }, { id: 'c22', type: 'input' }, { type: 'equals', value: '=' }, { type: 'given', value: '11' },
                        { type: 'equals', value: '=' }, null, { type: 'equals', value: '=' }, null, null,
                        { type: 'given', value: '4' }, null, { type: 'given', value: '8' }, null, null,
                    ]
                },
                {
                    numbers: [2, 3, 6, 18],
                    solution: { 'c00': 18, 'c02': 3, 'c20': 6, 'c22': 2 },
                    grid: [
                        { id: 'c00', type: 'input' }, { type: 'operator', value: '÷' }, { id: 'c02', type: 'input' }, { type: 'equals', value: '=' }, { type: 'given', value: '6' },
                        { type: 'operator', value: '÷' }, null, { type: 'operator', value: '*' }, null, null,
                        { id: 'c20', type: 'input' }, { type: 'operator', value: '*' }, { id: 'c22', type: 'input' }, { type: 'equals', value: '=' }, { type: 'given', value: '12' },
                        { type: 'equals', value: '=' }, null, { type: 'equals', value: '=' }, null, null,
                        { type: 'given', value: '3' }, null, { type: 'given', value: '6' }, null, null,
                    ]
                },
                {
                    numbers: [3, 4, 9, 10, 19, 20, 1],
                    hints: { 'c02': 7, 'c22': 5 },
                    solution: { 'c00': 3, 'c02': 7, 'c04': 10, 'c20': 4, 'c22': 5, 'c24': 9, 'c40': 20, 'c42': 1, 'c44': 19 },
                    grid: [
                        { id: 'c00', type: 'input' }, { type: 'operator', value: '+' }, { id: 'c02', type: 'hint' },  { type: 'equals', value: '=' }, { id: 'c04', type: 'input' },
                        null, null, null, null, { type: 'operator', value: '+' },
                        { id: 'c20', type: 'input' }, { type: 'operator', value: '+' }, { id: 'c22', type: 'hint' },  { type: 'equals', value: '=' }, { id: 'c24', type: 'input' },
                        null, null, null, null, { type: 'equals', value: '=' },
                        { id: 'c40', type: 'input' }, { type: 'operator', value: '-' }, { id: 'c42', type: 'input' }, { type: 'equals', value: '=' }, { id: 'c44', type: 'input' },
                    ]
                },
                { 
                    numbers: [1, 5, 15, 20, 40, 40, 45, 60],
                    hints: { 'c22': 4 },
                    solution: { 'c00': 40, 'c02': 1, 'c04': 40, 'c20': 20, 'c22': 4, 'c24': 5, 'c40': 60, 'c42': 15, 'c44': 45 },
                    grid: [
                        { id: 'c00', type: 'input' },  { type: 'operator', value: '*' }, { id: 'c02', type: 'input' }, { type: 'equals', value: '=' }, { id: 'c04', type: 'input' },
                        { type: 'operator', value: '+' }, null, null, null, { type: 'operator', value: '+' },
                        { id: 'c20', type: 'input' }, { type: 'operator', value: '÷' }, { id: 'c22', type: 'hint' }, { type: 'equals', value: '=' }, { id: 'c24', type: 'input' },
                        { type: 'equals', value: '=' }, null, null, null, { type: 'equals', value: '=' },
                        { id: 'c40', type: 'input' }, { type: 'operator', value: '-' }, { id: 'c42', type: 'input' }, { type: 'equals', value: '=' }, { id: 'c44', type: 'input' },
                    ]
                },
                // --- NEW LEVEL 6 BASED ON YOUR SCHEMA ---
                {
                    numbers: [2, 23, 24, 121, 168, 242, 266],
                    hints: { 'c22': 7, 'c40': 289 },
                    solution: { 'c00': 121, 'c02': 2, 'c04': 242, 'c20': 168, 'c22': 7, 'c24': 24, 'c40': 289, 'c42': 23, 'c44': 266 },
                    grid: [
                        { id: 'c00', type: 'input' },  { type: 'operator', value: '*' }, { id: 'c02', type: 'input' }, { type: 'equals', value: '=' }, { id: 'c04', type: 'input' },
                        { type: 'operator', value: '+' }, null, null, null, { type: 'operator', value: '+' },
                        { id: 'c20', type: 'input' }, { type: 'operator', value: '÷' }, { id: 'c22', type: 'hint' }, { type: 'equals', value: '=' }, { id: 'c24', type: 'input' },
                        { type: 'equals', value: '=' }, null, null, null, { type: 'equals', value: '=' },
                        { id: 'c40', type: 'hint' }, { type: 'operator', value: '-' }, { id: 'c42', type: 'input' }, { type: 'equals', value: '=' }, { id: 'c44', type: 'input' },
                    ]
                },
                // Level 7 (Unchanged)
                { 
                    numbers: [1, 5, 8, 10, 11, 12],
                    hints: { 'c02': 2, 'c24': 20, 'c40': 7 },
                    solution: { 'c00': 10, 'c02': 2, 'c04': 5, 'c20': 1, 'c22': 11, 'c24': 20, 'c40': 7, 'c42': 8, 'c44': 12 },
                    grid: [
                        { id: 'c00', type: 'input' }, { type: 'operator', value: '*' }, { id: 'c02', type: 'hint' },  { type: 'equals', value: '=' }, { id: 'c24', type: 'hint' },
                        { type: 'operator', value: '-' }, null, { type: 'operator', value: '-' }, null, { type: 'operator', value: '+' },
                        { id: 'c20', type: 'input' }, { type: 'operator', value: '+' }, { id: 'c22', type: 'input' }, { type: 'equals', value: '=' }, { id: 'c44', type: 'input' },
                        { type: 'equals', value: '=' }, null, { type: 'equals', value: '=' }, null, { type: 'equals', value: '=' },
                        { id: 'c40', type: 'hint' },  { type: 'operator', value: '+' }, { id: 'c42', type: 'input' }, { type: 'equals', value: '=' }, { type: 'given', value: '15' },
                    ]
                }
            ];

            let gameState = { currentLevel: 0 };
            let currentDraggedTile = null;
            let currentDraggedValue = null;
            let ghostTile = null;
            
            function saveState() { localStorage.setItem('mathCrosswordState', JSON.stringify(gameState)); }
            function loadState() {
                const savedState = localStorage.getItem('mathCrosswordState');
                if (savedState) gameState = JSON.parse(savedState);
            }
            
            function loadLevel(levelIndex) {
                if (levelIndex >= levels.length) {
                    showWinScreen();
                    return;
                }

                if (levelIndex >= 3) {
                    document.body.classList.remove('theme-green');
                    document.body.classList.add('theme-red');
                } else {
                    document.body.classList.remove('theme-red');
                    document.body.classList.add('theme-green');
                }

                gameState.currentLevel = levelIndex;
                const levelData = levels[levelIndex];
                
                levelIndicator.textContent = `Рівень ${levelIndex + 1}`;
                messageArea.textContent = '';
                controlsContainer.classList.remove('hidden');
                nextLevelContainer.classList.add('hidden');
                winContainer.classList.add('hidden');
                
                gridContainer.innerHTML = '';
                levelData.grid.forEach(cellData => {
                    const cell = document.createElement('div');
                    if (cellData === null) {
                        gridContainer.appendChild(cell);
                        return;
                    }
                    if(levelData.hints && levelData.hints[cellData.id] !== undefined) {
                        cell.className = 'cell hint';
                        cell.textContent = levelData.hints[cellData.id];
                        cell.dataset.value = levelData.hints[cellData.id];
                    } else {
                        cell.className = `cell ${cellData.type}`;
                         if (cellData.value) cell.textContent = cellData.value;
                    }
                    
                    if (cellData.id) cell.id = cellData.id;
                    if (cellData.type === 'input') cell.addEventListener('click', onCellClick);

                    gridContainer.appendChild(cell);
                });

                numbersContainer.innerHTML = '';
                const hintValues = levelData.hints ? Object.values(levelData.hints) : [];
                
                shuffleArray([...levelData.numbers]).forEach((num, index) => {
                    const tile = document.createElement('div');
                    tile.className = 'number-tile';
                    tile.textContent = num;
                    tile.draggable = true;
                    tile.dataset.value = num;
                    tile.id = `tile-${gameState.currentLevel}-${index}`;

                    const hintIndex = hintValues.indexOf(num);
                    if (hintIndex > -1) {
                        tile.classList.add('used');
                        hintValues.splice(hintIndex, 1);
                    }
                    
                    tile.addEventListener('dragstart', onDragStart);
                    tile.addEventListener('dragend', onDragEnd);
                    tile.addEventListener('touchstart', onTouchStart, {passive: false});
                    numbersContainer.appendChild(tile);
                });

                saveState();
            }
            
            function checkSolution() {
                const levelData = levels[gameState.currentLevel];
                let allCorrect = true;
                let isComplete = true;

                for (const id in levelData.solution) {
                    const cell = document.getElementById(id);
                    if (!cell) continue;
                    if (!cell.textContent && cell.classList.contains('input')) { 
                        isComplete = false; 
                        continue; 
                    }
                    cell.classList.remove('correct', 'incorrect');
                    if (cell.textContent != levelData.solution[id]) {
                       if(cell.classList.contains('input') || cell.classList.contains('hint')){
                           allCorrect = false;
                           if (cell.classList.contains('input')) cell.classList.add('incorrect');
                       }
                    } else {
                         if (cell.classList.contains('input') || cell.classList.contains('hint')) {
                            cell.classList.add('correct');
                         }
                    }
                }

                if (!isComplete) {
                     messageArea.textContent = "Заповніть усі клітинки.";
                     messageArea.style.color = '#f97316';
                     return;
                }
                
                if (allCorrect) {
                     let equationsCorrect = true;
                     const valueMap = new Map();
                     document.querySelectorAll('.cell[id]').forEach(c => valueMap.set(c.id, parseInt(c.textContent)));

                     const checkEq = (id1, op, id2, resId) => {
                        const val1 = valueMap.get(id1);
                        const val2 = valueMap.get(id2);
                        const res = valueMap.get(resId);
                        if (op === '+') return val1 + val2 === res;
                        if (op === '-') return val1 - val2 === res;
                        if (op === '*') return val1 * val2 === res;
                        if (op === '÷') return val1 / val2 === res;
                        return false;
                     };
                    
                    const currentLevelIndex = gameState.currentLevel;
                    if(currentLevelIndex === 3) { // Level 4 Check
                        if (!checkEq('c00', '+', 'c02', 'c04')) equationsCorrect = false;
                        if (!checkEq('c20', '+', 'c22', 'c24')) equationsCorrect = false;
                        if (!checkEq('c40', '-', 'c42', 'c44')) equationsCorrect = false;
                        if ((valueMap.get('c04') + valueMap.get('c24')) !== valueMap.get('c44')) equationsCorrect = false;
                    } else if (currentLevelIndex === 4) { // Level 5 Check
                        if (!checkEq('c00', '*', 'c02', 'c04')) equationsCorrect = false;
                        if (!checkEq('c20', '÷', 'c22', 'c24')) equationsCorrect = false;
                        if (!checkEq('c40', '-', 'c42', 'c44')) equationsCorrect = false;
                        if ((valueMap.get('c00') + valueMap.get('c20')) !== valueMap.get('c40')) equationsCorrect = false;
                        if ((valueMap.get('c04') + valueMap.get('c24')) !== valueMap.get('c44')) equationsCorrect = false;
                    } else if (currentLevelIndex === 5) { // Level 6 Check
                        if (!checkEq('c00', '*', 'c02', 'c04')) equationsCorrect = false;
                        if (!checkEq('c20', '÷', 'c22', 'c24')) equationsCorrect = false;
                        if (!checkEq('c40', '-', 'c42', 'c44')) equationsCorrect = false;
                        if ((valueMap.get('c00') + valueMap.get('c20')) !== valueMap.get('c40')) equationsCorrect = false;
                        if ((valueMap.get('c04') + valueMap.get('c24')) !== valueMap.get('c44')) equationsCorrect = false;
                    }


                     if(equationsCorrect) {
                        messageArea.textContent = 'Чудово! Все вірно!';
                        messageArea.style.color = document.body.classList.contains('theme-red') ? '#ef4444' : '#22c55e';
                        triggerConfetti();
                        controlsContainer.classList.add('hidden');
                        if (gameState.currentLevel >= levels.length - 1) {
                            showWinScreen();
                        } else {
                            nextLevelContainer.classList.remove('hidden');
                        }
                     } else {
                        allCorrect = false;
                     }
                } 

                if (!allCorrect) {
                    messageArea.textContent = 'Є помилки. Спробуйте ще.';
                    messageArea.style.color = '#ef4444';
                    for (const id in levelData.solution) {
                         const cell = document.getElementById(id);
                         if (cell && cell.textContent != levelData.solution[id] && cell.classList.contains('input')) {
                             cell.classList.add('incorrect');
                         }
                    }
                }
            }

            function showWinScreen() {
                messageArea.textContent = '';
                controlsContainer.classList.add('hidden');
                nextLevelContainer.classList.add('hidden');
                winContainer.classList.remove('hidden');
            }
            
            function resetCurrentLevel() { loadLevel(gameState.currentLevel); }
            function shuffleArray(array) {
                for (let i = array.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [array[i], array[j]] = [array[j], array[i]];
                }
                return array;
            }

            function onCellClick(e) {
                const cell = e.target;
                if (cell.textContent && cell.classList.contains('input')) {
                    const tileId = cell.dataset.tileRef;
                    cell.textContent = '';
                    cell.dataset.value = '';
                    cell.dataset.tileRef = '';
                    if (tileId) {
                        const tile = document.getElementById(tileId);
                        if(tile) tile.classList.remove('used');
                    }
                }
            }
            function onDragStart(e) {
                const tile = e.currentTarget;
                if (!tile || tile.classList.contains('used')) {
                    e.preventDefault();
                    return;
                }
                currentDraggedTile = tile;
                currentDraggedValue = tile.dataset.value;
                e.dataTransfer.setData('text/plain', currentDraggedValue);
                setTimeout(() => tile.style.opacity = '0.5', 0);
            }
            function onDragEnd() {
                if (currentDraggedTile) {
                    currentDraggedTile.style.opacity = '1';
                }
                document.querySelectorAll('.input.over').forEach(c => c.classList.remove('over'));
                currentDraggedTile = null; 
                currentDraggedValue = null;
            }
            function handleDragOver(e) {
                 e.preventDefault();
                 const dropTarget = getDropTarget(e.clientX, e.clientY);
                 document.querySelectorAll('.input.over').forEach(c => c.classList.remove('over'));
                 if(dropTarget) dropTarget.classList.add('over');
            }
            function handleDropEvent(e) {
                e.preventDefault();
                const dropTarget = getDropTarget(e.clientX, e.clientY);
                if (dropTarget && currentDraggedValue) handleDrop(dropTarget);
                onDragEnd();
            }
            function createGhostTile(tile) {
                ghostTile = tile.cloneNode(true);
                ghostTile.classList.add('dragging');
                document.body.appendChild(ghostTile);
            }
            function onTouchStart(e) {
                e.preventDefault();
                const tile = e.currentTarget;
                if (!tile || tile.classList.contains('used')) return;
                currentDraggedTile = tile; 
                currentDraggedValue = tile.dataset.value;
                createGhostTile(tile);
                const touch = e.touches[0];
                updateGhostPosition(touch.clientX, touch.clientY);
                document.addEventListener('touchmove', onTouchMove, {passive: false});
                document.addEventListener('touchend', onTouchEnd);
            }
            function onTouchMove(e) {
                e.preventDefault();
                const touch = e.touches[0];
                updateGhostPosition(touch.clientX, touch.clientY);
                const dropTarget = getDropTarget(touch.clientX, touch.clientY);
                document.querySelectorAll('.input.over').forEach(c => c.classList.remove('over'));
                if (dropTarget) dropTarget.classList.add('over');
            }
            function onTouchEnd(e) {
                const touch = e.changedTouches[0];
                const dropTarget = getDropTarget(touch.clientX, touch.clientY);
                if (dropTarget) handleDrop(dropTarget);
                document.querySelectorAll('.input.over').forEach(c => c.classList.remove('over'));
                if (ghostTile) { ghostTile.remove(); ghostTile = null; }
                currentDraggedTile = null; 
                currentDraggedValue = null;
                document.removeEventListener('touchmove', onTouchMove);
                document.removeEventListener('touchend', onTouchEnd);
            }
            function updateGhostPosition(x, y) {
                if(ghostTile) {
                    ghostTile.style.left = `${x - ghostTile.offsetWidth / 2}px`;
                    ghostTile.style.top = `${y - ghostTile.offsetHeight / 2}px`;
                }
            }
            function getDropTarget(x, y) {
                 const element = document.elementFromPoint(x, y);
                 if (element && element.classList.contains('input')) return element;
                 return null;
            }
            function handleDrop(dropTarget) {
                if (dropTarget.dataset.tileRef) {
                    const oldTileId = dropTarget.dataset.tileRef;
                    const oldTile = document.getElementById(oldTileId);
                    if (oldTile) oldTile.classList.remove('used');
                }
                dropTarget.textContent = currentDraggedValue;
                dropTarget.dataset.value = currentDraggedValue;
                if (currentDraggedTile) {
                    currentDraggedTile.classList.add('used');
                    dropTarget.dataset.tileRef = currentDraggedTile.id;
                }
                clearFeedback();
            }
            function clearFeedback() {
                document.querySelectorAll('.cell').forEach(cell => cell.classList.remove('correct', 'incorrect'));
                messageArea.textContent = '';
            }
            function triggerConfetti() {
                confettiContainer.innerHTML = '';
                for (let i = 0; i < 100; i++) {
                    const confetti = document.createElement('div');
                    confetti.classList.add('confetti');
                    confetti.style.left = Math.random() * 100 + 'vw';
                    confetti.style.top = Math.random() * -100 + 'vh';
                    const isRedTheme = document.body.classList.contains('theme-red');
                    const hue = isRedTheme ? (Math.random() > 0.5 ? 0 : 340) + Math.random() * 40 : 80 + Math.random() * 60;
                    confetti.style.backgroundColor = `hsl(${hue}, 100%, 50%)`;
                    confetti.style.animationDelay = Math.random() * 2 + 's';
                    confettiContainer.appendChild(confetti);
                }
                setTimeout(() => confettiContainer.innerHTML = '', 5000);
            }

            function init() {
                loadState();
                loadLevel(gameState.currentLevel);
                
                checkBtn.addEventListener('click', checkSolution);
                resetBtn.addEventListener('click', resetCurrentLevel);
                nextLevelBtn.addEventListener('click', () => loadLevel(gameState.currentLevel + 1));
                playAgainBtn.addEventListener('click', () => loadLevel(0));

                document.addEventListener('dragover', handleDragOver);
                document.addEventListener('drop', handleDropEvent);
            }

            init();
        });
    </script>
</body>
</html>
